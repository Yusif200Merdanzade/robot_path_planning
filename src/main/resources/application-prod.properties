app.open-browser=false

server.port=${PORT:8088}

# Serverdə proqram birbaşa kök ünvanda açılır: https://<ad>.onrender.com/ (sonuna yol yazmağa ehtiyac yoxdur)
server.servlet.context-path=

# Serverde parol ve JWT acarinin default-u yoxdur: verilmeyibse proqram ise dusmur
# (hamiya melum "admin" parolu ile acig qalmaqdansa, deploy-un dusmesi daha yaxsidir).
app.auth.password=${APP_PASSWORD}
app.auth.jwt-secret=${JWT_SECRET}

# Render sorgunu oz proxy-si ile oturur: bu olmadan butun istifadecilerin IP-si eyni (proxy-nin IP-si)
# gorunur ve sorgu limiti hamini birlikde bloklayir. Tomcat esl IP-ni X-Forwarded-For-dan berpa edir.
server.forward-headers-strategy=native

# CAPTCHA: serverde real Turnstile acarlari mecburidir (default yoxdur - verilmeyibse proqram ise dusmur).
# Test acarlari prod-da qebul olunmur: tesadufen qoyulsa CAPTCHA hamini sessizce buraxardi.
# Qeza halinda muveqqeti sondurmek: Render-de CAPTCHA_ENABLED=false.
app.captcha.site-key=${TURNSTILE_SITE_KEY}
app.captcha.secret-key=${TURNSTILE_SECRET_KEY}
app.captcha.allow-test-keys=false
app.captcha.expected-hostname=${TURNSTILE_HOSTNAME:}
