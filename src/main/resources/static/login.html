<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş — Anbar Robotu</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #e6ddd0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }
        form {
            background: #f4efe6;
            border: 3px solid #5a5040;
            border-radius: 6px;
            padding: 28px 32px;
            width: 100%;
            max-width: 380px;   /* CAPTCHA vidceti ən azı 300px enindədir */
            box-sizing: border-box;
        }
        #captcha-box { margin-bottom: 14px; }
        #captcha-box[hidden] { display: none; }
        /* "Mən robot deyiləm" — klik Cloudflare yoxlamasını başladır (bax: CAPTCHA_ADAPTERS.turnstile) */
        .human {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            margin: 0 0 8px;
            border: 1px solid #b8ad98;
            border-radius: 4px;
            background: #fff;
            font-size: 14px;
            cursor: pointer;
        }
        .human[hidden] { display: none; }
        .human input {
            width: 22px;
            height: 22px;
            margin: 0;
            cursor: inherit;
        }
        .human.ok { border-color: #2e8b57; color: #2e8b57; }
        .human .brand { margin-left: auto; font-size: 11px; color: #888; }
        h1 {
            color: #3a3226;
            font-size: 20px;
            margin: 0 0 4px;
        }
        p.sub {
            color: #888;
            font-size: 13px;
            margin: 0 0 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #2c2416;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            font-size: 15px;
            border: 1px solid #b8ad98;
            border-radius: 4px;
            margin-bottom: 14px;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #1f6da0; }
        button:disabled { background: #8aa9bf; cursor: default; }
        #msg {
            font-size: 13px;
            color: #c81e1e;
            margin-bottom: 14px;
        }
        #msg:empty { display: none; }
    </style>
</head>
<body>
<form id="login">
    <h1>🤖 Anbar Robotu</h1>
    <p class="sub">Simulyasiyaya baxmaq üçün daxil olun</p>
    <div id="msg"></div>
    <label for="username">İstifadəçi adı</label>
    <input type="text" id="username" autocomplete="username" required autofocus>
    <label for="password">Parol</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div id="captcha-box" hidden>
        <label class="human" id="human" hidden>
            <input type="checkbox" id="human-check">
            <span id="human-text">Mən robot deyiləm</span>
            <small class="brand">Cloudflare ilə qorunur</small>
        </label>
        <div id="captcha"></div>
    </div>
    <button type="submit" id="submit" disabled>Daxil ol</button>
</form>

<script>
// Ünvanlar nisbidir ("api/auth/login", "./"): həm lokalda (/robot-path-planning/), həm serverdə (/) işləyir
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

// Düymə yalnız bu şərtlərin hamısı ödənəndə aktivdir (bax: updateSubmit)
const state = {
    captchaRequired: true,   // server CAPTCHA-nı söndürübsə false
    captchaToken: null,      // vidcetin verdiyi birdəfəlik token
    blocked: false,          // rate limit geri sayımı gedir
    sending: false           // sorğu göndərilib, cavab gözlənilir
};
let widgetId = null;
let countdown = null;

function updateSubmit() {
    submit.disabled = state.sending || state.blocked || (state.captchaRequired && !state.captchaToken);
}

// ==================== CAPTCHA ====================
// Provayderi və açıq açarı serverdən alır (GET api/auth/captcha), skripti yükləyir, vidceti qurur.
// Token birdəfəlikdir: hər göndərişdən sonra (uğursuz olsa belə) vidcet yenilənir.
// Provayderə xas olan yalnız bu adapterlərdir — qalan məntiq hamısı üçün eynidir.
const CAPTCHA_ADAPTERS = {
    // Cloudflare Turnstile, kliklə: vidcet əvvəlcədən qurulur, amma yoxlama yalnız "Mən robot deyiləm"-ə
    // klikdən sonra başlayır (execution: 'execute'). Qərarı yenə Cloudflare verir — klik özü sübut deyil,
    // yoxlamanın başlanğıcıdır; şübhəli halda Cloudflare öz tapşırığını da göstərir.
    turnstile: {
        scriptUrl: 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onCaptchaLoad',
        render: (config, handlers) => turnstile.render('#captcha', {
            sitekey: config.siteKey, action: config.action, size: 'flexible',
            // Cloudflare-in öz vidceti yalnız istifadəçidən əlavə addım lazım olanda görünür — adətən 1 qutu qalır
            execution: 'execute', appearance: 'interaction-only', ...handlers
        }),
        execute: () => turnstile.execute('#captcha'),
        reset: id => turnstile.reset(id)
    },
    // Google reCAPTCHA v2: "I'm not a robot" qutusu Google-un öz vidcetidir
    recaptcha: {
        scriptUrl: 'https://www.google.com/recaptcha/api.js?render=explicit&hl=az&onload=onCaptchaLoad',
        render: (config, handlers) => grecaptcha.render('captcha', { sitekey: config.siteKey, ...handlers }),
        reset: id => grecaptcha.reset(id)
    }
};
let captchaAdapter = null;

// "Mən robot deyiləm" qutusu: idle (klik gözləyir) -> checking (Cloudflare yoxlayır) -> ok (token alındı)
const human = document.getElementById('human');
const humanCheck = document.getElementById('human-check');
const humanText = document.getElementById('human-text');
const HUMAN_STATES = {
    idle:     { checked: false, text: 'Mən robot deyiləm' },
    checking: { checked: true,  text: 'Yoxlanılır…' },
    ok:       { checked: true,  text: 'Təsdiqləndi ✓' }
};

function setHuman(name) {
    const s = HUMAN_STATES[name];
    humanCheck.checked = s.checked;
    humanCheck.disabled = name !== 'idle';   // yoxlama gedərkən və keçəndən sonra təkrar klik olmur
    humanText.textContent = s.text;
    human.classList.toggle('ok', name === 'ok');
}

humanCheck.addEventListener('change', () => {
    if (!humanCheck.checked) return;
    msg.textContent = '';
    setHuman('checking');
    captchaAdapter.execute();
});

function initCaptcha() {
    fetch('api/auth/captcha').then(r => r.json()).then(config => {
        state.captchaRequired = config.enabled;
        updateSubmit();
        if (!config.enabled) return;
        captchaAdapter = CAPTCHA_ADAPTERS[config.provider];
        const clickToStart = Boolean(captchaAdapter.execute);
        document.getElementById('captcha-box').hidden = false;
        human.hidden = !clickToStart;
        const handlers = {
            callback: token => {
                state.captchaToken = token;
                if (clickToStart) setHuman('ok');
                updateSubmit();
            },
            'expired-callback': () => resetCaptcha(),   // token vaxtı keçdi — yenidən klik lazımdır
            // Həm yoxlama keçilməyəndə (bot şübhəsi), həm vidcet yüklənməyəndə çağırılır
            'error-callback': () => {
                resetCaptcha();
                msg.textContent = 'Robot yoxlaması keçilmədi. Yenidən cəhd edin.';
            }
        };
        window.onCaptchaLoad = () => { widgetId = captchaAdapter.render(config, handlers); };
        const script = document.createElement('script');
        script.src = captchaAdapter.scriptUrl;
        script.async = true;
        script.onerror = () => msg.textContent = 'Robot yoxlaması yüklənmədi. İnternet əlaqəsini yoxlayın.';
        document.head.appendChild(script);
    }).catch(() => msg.textContent = 'Serverlə əlaqə yoxdur. Səhifəni yeniləyin.');
}

function resetCaptcha() {
    state.captchaToken = null;
    if (widgetId !== null) captchaAdapter.reset(widgetId);
    if (captchaAdapter.execute) setHuman('idle');
    updateSubmit();
}

// ==================== Rate limit ====================
/** Limitə düşəndə: düymə bağlanır, mesajda saniyələr canlı azalır, vaxt bitəndə düymə özü açılır. */
function blockFor(seconds) {
    clearInterval(countdown);
    state.blocked = true;
    updateSubmit();
    let left = seconds;
    const render = () => msg.textContent = 'Çox cəhd etdiniz. ' + left + ' saniyə sonra yenidən yoxlayın.';
    render();
    countdown = setInterval(() => {
        left--;
        if (left > 0) return render();
        clearInterval(countdown);
        msg.textContent = '';
        state.blocked = false;
        updateSubmit();
    }, 1000);
}

// ==================== Giriş ====================
/** Server cavabını istifadəçi mesajına çevirir. */
async function errorFor(r) {
    if (r.status === 401) return new Error('İstifadəçi adı və ya parol səhvdir.');
    if (r.status === 429) {
        const error = new Error('rate-limited');
        error.retryAfter = parseInt(r.headers.get('Retry-After'), 10) || 60;
        return error;
    }
    const body = await r.json().catch(() => ({}));
    if (body.code === 'captcha_rejected' || body.code === 'captcha_unavailable') return new Error(body.detail);
    return new Error('Server xətası (' + r.status + '). Yenidən cəhd edin.');
}

document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    msg.textContent = '';
    state.sending = true;
    updateSubmit();
    fetch('api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            captchaToken: state.captchaToken
        })
    }).then(async r => {
        if (!r.ok) throw await errorFor(r);
        return r.json();
    }).then(res => {
        // Yalnız index.html-ə ötürmək üçün: o, tokeni götürən kimi buradan silir (hər açılışda giriş tələb olunsun)
        sessionStorage.setItem('accessToken', res.accessToken);
        location.replace('./');
    }).catch(err => {
        resetCaptcha();   // token istifadə olundu — növbəti cəhd üçün yenisi lazımdır
        state.sending = false;
        if (err.retryAfter) return blockFor(err.retryAfter);
        msg.textContent = err.message === 'Failed to fetch' ? 'Serverlə əlaqə yoxdur.' : err.message;
        updateSubmit();
    });
});

initCaptcha();
</script>
</body>
</html>
