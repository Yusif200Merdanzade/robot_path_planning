<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Giriş — Anbar Robotu</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #e6ddd0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            box-sizing: border-box;
        }
        form {
            background: #f4efe6;
            border: 3px solid #5a5040;
            border-radius: 6px;
            padding: 28px 32px;
            width: 100%;
            max-width: 380px;   /* CAPTCHA vidceti ən azı 300px enindədir */
            box-sizing: border-box;
        }
        #captcha {
            min-height: 65px;   /* vidcet yüklənənə qədər forma "tullanmasın" */
            margin-bottom: 14px;
        }
        #captcha:empty { display: none; }
        h1 {
            color: #3a3226;
            font-size: 20px;
            margin: 0 0 4px;
        }
        p.sub {
            color: #888;
            font-size: 13px;
            margin: 0 0 20px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #2c2416;
            margin-bottom: 4px;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px 10px;
            font-size: 15px;
            border: 1px solid #b8ad98;
            border-radius: 4px;
            margin-bottom: 14px;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 10px;
            font-size: 15px;
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover { background: #1f6da0; }
        button:disabled { background: #8aa9bf; cursor: default; }
        #msg {
            font-size: 13px;
            color: #c81e1e;
            margin-bottom: 14px;
        }
        #msg:empty { display: none; }
    </style>
</head>
<body>
<form id="login">
    <h1>🤖 Anbar Robotu</h1>
    <p class="sub">Simulyasiyaya baxmaq üçün daxil olun</p>
    <div id="msg"></div>
    <label for="username">İstifadəçi adı</label>
    <input type="text" id="username" autocomplete="username" required autofocus>
    <label for="password">Parol</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div id="captcha"></div>
    <button type="submit" id="submit" disabled>Daxil ol</button>
</form>

<script>
// Ünvanlar nisbidir ("api/auth/login", "./"): həm lokalda (/robot-path-planning/), həm serverdə (/) işləyir
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

// Düymə yalnız bu şərtlərin hamısı ödənəndə aktivdir (bax: updateSubmit)
const state = {
    captchaRequired: true,   // server CAPTCHA-nı söndürübsə false
    captchaToken: null,      // vidcetin verdiyi birdəfəlik token
    blocked: false,          // rate limit geri sayımı gedir
    sending: false           // sorğu göndərilib, cavab gözlənilir
};
let widgetId = null;
let countdown = null;

function updateSubmit() {
    submit.disabled = state.sending || state.blocked || (state.captchaRequired && !state.captchaToken);
}

// ==================== CAPTCHA (Cloudflare Turnstile) ====================
// Açıq parametrləri serverdən alır, Cloudflare skriptini yükləyir və vidceti qurur.
// Token birdəfəlikdir: hər göndərişdən sonra (uğursuz olsa belə) vidcet yenilənir.
function initCaptcha() {
    fetch('api/auth/captcha').then(r => r.json()).then(config => {
        state.captchaRequired = config.enabled;
        updateSubmit();
        if (!config.enabled) return;
        window.onTurnstileLoad = () => {
            widgetId = turnstile.render('#captcha', {
                sitekey: config.siteKey,
                action: config.action,
                size: 'flexible',
                callback: token => { state.captchaToken = token; updateSubmit(); },
                'expired-callback': () => { state.captchaToken = null; updateSubmit(); },
                'error-callback': () => {
                    state.captchaToken = null;
                    updateSubmit();
                    msg.textContent = 'Robot yoxlaması yüklənmədi. Səhifəni yeniləyin.';
                }
            });
        };
        const script = document.createElement('script');
        script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onTurnstileLoad';
        script.async = true;
        script.onerror = () => msg.textContent = 'Robot yoxlaması yüklənmədi. İnternet əlaqəsini yoxlayın.';
        document.head.appendChild(script);
    }).catch(() => msg.textContent = 'Serverlə əlaqə yoxdur. Səhifəni yeniləyin.');
}

function resetCaptcha() {
    state.captchaToken = null;
    if (widgetId !== null) turnstile.reset(widgetId);
}

// ==================== Rate limit ====================
/** Limitə düşəndə: düymə bağlanır, mesajda saniyələr canlı azalır, vaxt bitəndə düymə özü açılır. */
function blockFor(seconds) {
    clearInterval(countdown);
    state.blocked = true;
    updateSubmit();
    let left = seconds;
    const render = () => msg.textContent = 'Çox cəhd etdiniz. ' + left + ' saniyə sonra yenidən yoxlayın.';
    render();
    countdown = setInterval(() => {
        left--;
        if (left > 0) return render();
        clearInterval(countdown);
        msg.textContent = '';
        state.blocked = false;
        updateSubmit();
    }, 1000);
}

// ==================== Giriş ====================
/** Server cavabını istifadəçi mesajına çevirir. */
async function errorFor(r) {
    if (r.status === 401) return new Error('İstifadəçi adı və ya parol səhvdir.');
    if (r.status === 429) {
        const error = new Error('rate-limited');
        error.retryAfter = parseInt(r.headers.get('Retry-After'), 10) || 60;
        return error;
    }
    const body = await r.json().catch(() => ({}));
    if (body.code === 'captcha_rejected' || body.code === 'captcha_unavailable') return new Error(body.detail);
    return new Error('Server xətası (' + r.status + '). Yenidən cəhd edin.');
}

document.getElementById('login').addEventListener('submit', (e) => {
    e.preventDefault();
    msg.textContent = '';
    state.sending = true;
    updateSubmit();
    fetch('api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
            captchaToken: state.captchaToken
        })
    }).then(async r => {
        if (!r.ok) throw await errorFor(r);
        return r.json();
    }).then(res => {
        // Yalnız index.html-ə ötürmək üçün: o, tokeni götürən kimi buradan silir (hər açılışda giriş tələb olunsun)
        sessionStorage.setItem('accessToken', res.accessToken);
        location.replace('./');
    }).catch(err => {
        resetCaptcha();   // token istifadə olundu — növbəti cəhd üçün yenisi lazımdır
        state.sending = false;
        if (err.retryAfter) return blockFor(err.retryAfter);
        msg.textContent = err.message === 'Failed to fetch' ? 'Serverlə əlaqə yoxdur.' : err.message;
        updateSubmit();
    });
});

initCaptcha();
</script>
</body>
</html>
