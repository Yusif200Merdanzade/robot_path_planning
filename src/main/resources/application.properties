spring.application.name=robot-path-planning
server.port=8088
server.servlet.context-path=/robot-path-planning

app.open-browser=true

# Brauzer index.html-i kesde saxlamasin: her defe serverden yoxlasin (deyismeyibse 304 qaytarilir).
# Bu olmadan brauzer kohne versiyani saatlarla gosterir ve yeni deyisiklikler gorunmur.
spring.web.resources.cache.cachecontrol.no-cache=true

# Giris (JWT). Istifadeci helelik statikdir. Lokalda default deyerler isleyir; serverde
# APP_USERNAME / APP_PASSWORD / JWT_SECRET muhit deyisenleri ile verilir (bax: application-prod.properties).
app.auth.username=${APP_USERNAME:robot}
app.auth.password=${APP_PASSWORD:Robot@123!}
# HS512 ucun en azi 64 simvol. Bu default yalniz lokal ucundur.
app.auth.jwt-secret=${JWT_SECRET:local-dev-secret-local-dev-secret-local-dev-secret-local-dev-secret-0123456789}
app.auth.token-ttl=1d
# Spring-in oz "generated security password" istifadecisi lazim deyil — giris AuthService + JWT ile gedir
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Sorgu limiti (rate limiting), bax: security/ratelimit. Her qayda her IP ucun ayrica hesablanir
# (IPv6 /64 sebekeye gore). Sorguya uygun gelen BUTUN qaydalar tetbiq olunur. Bir qaydada bir nece
# limit ola biler - hamisi eyni anda quvvededir. Limit kecilende 429 + Retry-After qaytarilir.
app.rate-limit.enabled=true
app.rate-limit.max-tracked-clients=100000

# Giris: deqiqede 5 (parol sinamaga qarsi) ve saatda 20 (yavas, uzunmuddetli sinamaga qarsi)
app.rate-limit.rules[0].name=login
app.rate-limit.rules[0].method=POST
app.rate-limit.rules[0].path=/api/auth/login
app.rate-limit.rules[0].limits[0].capacity=5
app.rate-limit.rules[0].limits[0].period=1m
app.rate-limit.rules[0].limits[1].capacity=20
app.rate-limit.rules[0].limits[1].period=1h

# Simulyasiyani yeniden baslatma: hami ucun ortaqdir, spam ile sifirlanmasin
app.rate-limit.rules[1].name=start
app.rate-limit.rules[1].path=/api/start
app.rate-limit.rules[1].limits[0].capacity=4
app.rate-limit.rules[1].limits[0].period=1m

# Fuzzy hesablama API-si
app.rate-limit.rules[2].name=attention
app.rate-limit.rules[2].method=POST
app.rate-limit.rules[2].path=/api/attention
app.rate-limit.rules[2].limits[0].capacity=60
app.rate-limit.rules[2].limits[0].period=1m

# WebSocket qosulmalari: elaqe qopanda brauzer her 2 san yeniden qosulur - 20/deq bunu rahat kecirir
app.rate-limit.rules[3].name=websocket
app.rate-limit.rules[3].path=/ws/robot
app.rate-limit.rules[3].limits[0].capacity=20
app.rate-limit.rules[3].limits[0].period=1m

# Umumi qalxan: butun API ucun bir IP-den deqiqede 120 sorgu (yuxaridakilarla birlikde isleyir)
app.rate-limit.rules[4].name=api
app.rate-limit.rules[4].path=/api/**
app.rate-limit.rules[4].limits[0].capacity=120
app.rate-limit.rules[4].limits[0].period=1m
