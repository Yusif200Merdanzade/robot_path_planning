spring.application.name=robot-path-planning
server.port=8088
server.servlet.context-path=/robot-path-planning

app.open-browser=true

# Brauzer index.html-i kesde saxlamasin: her defe serverden yoxlasin (deyismeyibse 304 qaytarilir).
# Bu olmadan brauzer kohne versiyani saatlarla gosterir ve yeni deyisiklikler gorunmur.
spring.web.resources.cache.cachecontrol.no-cache=true

# Giris (JWT). Istifadeci helelik statikdir. Lokalda default deyerler isleyir; serverde
# APP_USERNAME / APP_PASSWORD / JWT_SECRET muhit deyisenleri ile verilir (bax: application-prod.properties).
app.auth.username=${APP_USERNAME:robot}
app.auth.password=${APP_PASSWORD:Robot@123!}
# HS512 ucun en azi 64 simvol. Bu default yalniz lokal ucundur.
app.auth.jwt-secret=${JWT_SECRET:local-dev-secret-local-dev-secret-local-dev-secret-local-dev-secret-0123456789}
app.auth.token-ttl=1d
# Spring-in oz "generated security password" istifadecisi lazim deyil — giris AuthService + JWT ile gedir
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
